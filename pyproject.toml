[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "spc-oee"
version = "0.1.0"
description = "Control charts, Cp/Cpk and OEE breakdown from two CSV files (standard library only)."
license = "MIT"
authors = [{ name = "Akmal Azeem" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
spc-oee = "spc_oee.cli:main"

[tool.setuptools]
packages = ["spc_oee"]

[tool.pytest.ini_options]
testpaths = ["tests"]
